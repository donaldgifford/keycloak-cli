---
# Langfuse client configuration
# Confidential client - requires client secret for Langfuse OAuth
realm: fartlab
client:
  clientId: langfuse
  name: Langfuse
  protocol: openid-connect
  description: Langfuse

  # Confidential client
  publicClient: false

  # OAuth flows
  standardFlowEnabled: true
  directAccessGrantsEnabled: false
  implicitFlowEnabled: false
  serviceAccountsEnabled: false

  # URLs
  rootUrl: https://langfuse.fartlab.dev
  baseUrl: https://langfuse.fartlab.dev
  redirectUris:
    - https://langfuse.fartlab.dev/api/auth/callback/keycloak
  webOrigins:
    - https://langfuse.fartlab.dev

  # Scopes
  defaultClientScopes:
    - groups  # realm-level scope, shared
    - roles  # realm-level scope, shared
    - profile  # realm-level scope, shared
    - basic  # realm-level scope, shared
    - email  # realm-level scope, shared
    - web-origins  # realm-level scope, shared
    - acr  # realm-level scope, shared
