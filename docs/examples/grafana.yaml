---
# Grafana client configuration
# Confidential client with client secret
realm: fartlab
client:
  clientId: grafana
  name: Grafana
  protocol: openid-connect
  description: Grafana monitoring dashboards

  # Confidential client
  publicClient: false

  # OAuth flows
  standardFlowEnabled: true
  directAccessGrantsEnabled: false
  implicitFlowEnabled: false
  serviceAccountsEnabled: false

  # URLs
  rootUrl: https://grafana.fartlab.dev
  baseUrl: https://grafana.fartlab.dev
  redirectUris:
    - https://grafana.fartlab.dev/login/generic_oauth
    # - https://grafana.fartlab.dev/*
  webOrigins:
    - https://grafana.fartlab.dev

  # Scopes
  defaultClientScopes:
    - groups  # realm-level scope, shared
    - roles  # realm-level scope, shared
    - profile  # realm-level scope, shared
    - basic  # realm-level scope, shared
    - email  # realm-level scope, shared
    - web-origins  # realm-level scope, shared
    - acr  # realm-level scope, shared
